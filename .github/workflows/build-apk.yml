name: Build Android APK

on:
  # 网页上手动点按钮触发
  workflow_dispatch:
  # push 到 main 自动构建
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runner 自带完整 Android SDK，ANDROID_HOME 已预设。
      # 不调用 android-actions/setup-android（v3 会跑已废弃的 `sdkmanager tools` 而失败）。
      # 这一步只做检查，永远不阻断构建。
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          echo "--- ndk ---"; ls "$SDK/ndk" 2>/dev/null || true
          echo "--- cmake ---"; ls "$SDK/cmake" 2>/dev/null || true
          echo "java: $(java -version 2>&1 | head -1)"
          node -v

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # 允许 AGP 自动下载缺失的 SDK 组件（平台 / build-tools / NDK）
      - name: Enable SDK auto-download
        run: |
          echo "android.builder.sdkDownload=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Locate APK
        if: always()
        run: find android -name '*.apk' -type f 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: octopmobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
